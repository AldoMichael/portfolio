<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <script>
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f4f7fb')
        }
      } catch (e) {}
    </script>

    <title>Aldo Randriantsoamanitra — Développeur Web / Full Stack</title>
    <meta
      name="description"
      content="Portfolio d'Aldo Michael Firmin Randriantsoamanitra, développeur web full stack basé à Madagascar : plus de 5 ans d'expérience en applications web, support ERP, backend/frontend et bases de données."
    />
    <meta name="author" content="Aldo Michael Firmin Randriantsoamanitra" />

    <!-- Open Graph / partage sur les réseaux -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aldo Randriantsoamanitra — Développeur Web / Full Stack" />
    <meta
      property="og:description"
      content="Plus de 5 ans d'expérience en développement d'applications web, support ERP, backend/frontend et gestion de bases de données."
    />
    <meta property="og:locale" content="fr_FR" />

    <!-- Polices : Space Grotesk (titres) + Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
